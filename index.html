<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Portal</title>
    <style>
      body {
        background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
      }
      h1 {
        color: #8b5cf6;
        margin-top: 40px;
      }
      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        padding: 40px;
      }
      .game-card {
        background: #181818;
        border-radius: 12px;
        padding: 15px;
        transition: transform 0.2s;
      }
      .game-card:hover {
        transform: scale(1.05);
      }
      iframe {
        width: 100%;
        height: 250px;
        border: none;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>🎮 Game Hub</h1>
    <p>Play fun HTML5 games directly in your browser!</p>

    <div class="game-grid">
      <div class="game-card">
        <h3>Flappy Bird</h3>
        <iframe src="https://funhtml5games.com?embed=flappy"></iframe>
      </div>

      <div class="game-card">
        <h3>2048</h3>
        <iframe src="https://funhtml5games.com?embed=2048"></iframe>
      </div>

      <div class="game-card">
        <h3>Stack Tower</h3>
        <iframe src="https://funhtml5games.com?embed=stack"></iframe>
      </div>
    </div>
  </body>
</html>
